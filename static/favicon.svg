<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
    <defs>
        <radialGradient id="ruby-core" cx="35%" cy="35%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="45%" stop-color="#ff003c"/>
            <stop offset="100%" stop-color="#cd0029"/>
        </radialGradient>
        <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#cd0029" flood-opacity="0.35"/>
        </filter>
    </defs>
    
    <!-- ⚪ Pure Crisp White Clean Base -->
    <rect width="100" height="100" rx="24" fill="#ffffff" stroke="#cd0029" stroke-width="3" />
    
    <!-- Outer Orbital Dashed Track -->
    <circle cx="50" cy="50" r="40" fill="none" stroke="#cd0029" stroke-width="2" stroke-dasharray="12 6" opacity="0.85"/>
    
    <!-- Concentric Dual Gyroscope Rings -->
    <ellipse cx="50" cy="50" rx="34" ry="15" fill="none" stroke="#cd0029" stroke-width="3.5" transform="rotate(-28 50 50)"/>
    <ellipse cx="50" cy="50" rx="34" ry="15" fill="none" stroke="#ff003c" stroke-width="2.5" transform="rotate(38 50 50)"/>
    
    <!-- 4 Satellite Orbital Nodes -->
    <circle cx="50" cy="10" r="4" fill="#cd0029" />
    <circle cx="50" cy="90" r="4" fill="#cd0029" />
    <circle cx="10" cy="50" r="4" fill="#ff003c" />
    <circle cx="90" cy="50" r="4" fill="#ff003c" />
    
    <!-- Central Glowing Ruby Nucleus -->
    <circle cx="50" cy="50" r="11" fill="url(#ruby-core)" filter="url(#soft-glow)"/>
    <circle cx="50" cy="50" r="3.5" fill="#ffffff"/>
</svg>
