<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
    <defs>
        <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2a0008"/>
            <stop offset="100%" stop-color="#050102"/>
        </radialGradient>
        <radialGradient id="ruby-grad" cx="40%" cy="40%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="50%" stop-color="#ff003c"/>
            <stop offset="100%" stop-color="#cd0029"/>
        </radialGradient>
        <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>
    <rect width="100" height="100" rx="24" fill="url(#bg-grad)" stroke="#cd0029" stroke-width="2"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="12 6"/>
    <ellipse cx="50" cy="50" rx="32" ry="14" fill="none" stroke="#cd0029" stroke-width="3" transform="rotate(-25 50 50)"/>
    <ellipse cx="50" cy="50" rx="32" ry="14" fill="none" stroke="#ff003c" stroke-width="2" transform="rotate(35 50 50)"/>
    <circle cx="50" cy="50" r="10" fill="url(#ruby-grad)" filter="url(#glow-red)"/>
    <circle cx="50" cy="50" r="3.5" fill="#ffffff"/>
</svg>
